<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlateLens Clone</title>
<style>
body { font-family: sans-serif; margin: 0; padding: 16px; }
#video { width: 100%; max-width: 400px; }
button { padding: 8px 12px; margin: 4px; }
ul { list-style: none; padding: 0; }
li { padding: 4px 0; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<h1>PlateLens Clone</h1>
<video id="video" autoplay playsinline></video>
<br>
<button id="startCam">Start Camera</button>
<button id="voice">Voice Log</button>
<input type="file" id="photo" accept="image/*">
<ul id="log"></ul>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const video = document.getElementById('video');
const log = document.getElementById('log');
function addEntry(name) {
    const li = document.createElement('li');
    li.textContent = name;
    log.appendChild(li);
}
document.getElementById('startCam').onclick = async () => {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const scan = () => {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(img.data, img.width, img.height);
            if (code) addEntry('Barcode: ' + code.data);
        }
        requestAnimationFrame(scan);
    };
    scan();
};
document.getElementById('voice').onclick = () => {
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.lang = 'en-US';
    rec.onresult = e => addEntry('Voice: ' + e.results[0][0].transcript);
    rec.start();
};
document.getElementById('photo').onchange = e => {
    const file = e.target.files[0];
    if (file) addEntry('Photo: ' + file.name);
};
</script>
</body>
</html>
